name: Dimensy image

# Builds the Dimensy Helpdesk image (linux/amd64) from a tag of this fork and publishes it to GHCR as
# ghcr.io/<owner>/dimensy-helpdesk:<tag>-f<frappe>, e.g. ...:v1.30.1-r18-f16.36.0.
# Runs only for tags like v1.30.1-r18 or by hand. The workflows inherited from upstream are disabled in the
# repository settings (not deleted, so merges from upstream stay clean).

on:
  push:
    tags: ["v*-r*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag of this fork to build, e.g. v1.30.1-r18"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: dimensy-image-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  FRAPPE_BRANCH: v16.36.0
  FRAPPE_DOCKER_REF: v3.2.2
  # pinned: telephony has no upstream tags, see deploy/apps.json in the Dimensy project
  TELEPHONY_URL: https://github.com/febrisutomo/telephony
  TELEPHONY_REF: v0.0.1-r1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # optional: set the repository secret DOCKERHUB_TOKEN and variable DOCKERHUB_USER to avoid anonymous pull limits
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Resolve and validate the tag
        id: v
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          TAG="${INPUT_REF:-$REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$'; then
            echo "Tag '$TAG' does not look like v1.30.1-r18" >&2; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/dimensy-helpdesk:${TAG}-f${FRAPPE_BRANCH#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: frappe_docker
          persist-credentials: false

      - name: Write apps.json
        env:
          TAG: ${{ steps.v.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          printf '[{"url":"%s","branch":"%s"},{"url":"https://github.com/%s","branch":"%s"}]\n' \
            "$TELEPHONY_URL" "$TELEPHONY_REF" "$REPO" "$TAG" > apps.json
          cat apps.json

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub login (optional)
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.v.outputs.image }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          # the app list is read from a build secret; its content is not part of the layer cache key, so the cache
          # is bypassed for the builder stage (same flags as the local build)
          secret-files: |
            apps_json=./apps.json
          no-cache-filters: builder
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Dimensy Helpdesk ${{ steps.v.outputs.tag }} on Frappe ${{ env.FRAPPE_BRANCH }}

      - name: Smoke test the pushed image
        env:
          IMAGE: ${{ steps.v.outputs.image }}
        run: |
          docker run --rm --entrypoint bash "$IMAGE" -c '
            set -e
            cd /home/frappe/frappe-bench
            echo "arch: $(uname -m)"
            ls apps
            test -f apps/helpdesk/helpdesk/www/help/index.html
            grep -q restrict_internal_ticket_access apps/helpdesk/helpdesk/hooks.py
            echo "fork patches present"'
          {
            echo "### Image"
            echo "\`$IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
